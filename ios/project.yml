# The Xcode project is generated from this file, so it is never edited by hand
# and never causes merge conflicts.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open Sublette.xcodeproj
#
# Run `xcodegen generate` again after adding, moving or deleting a Swift file
# outside Xcode, or after changing this file.
name: Sublette

options:
  bundleIdPrefix: app.sublette
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Debug talks to the server on this Mac. Staging and Release talk to hosted servers.
configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SUBLETTE_ENVIRONMENT: local
      SUBLETTE_API_BASE_URL: "http://localhost:8000"
      SUBLETTE_REQUEST_TIMEOUT: "10"
    Staging:
      SUBLETTE_ENVIRONMENT: staging
      # Replace with the staging server's address once it is deployed.
      SUBLETTE_API_BASE_URL: "https://staging.sublette.invalid"
      # Render's free server sleeps after 15 idle minutes and takes about a
      # minute to wake, so the first request after a pause needs longer.
      SUBLETTE_REQUEST_TIMEOUT: "75"
    Release:
      SUBLETTE_ENVIRONMENT: production
      # Replace with the production server's address before release.
      SUBLETTE_API_BASE_URL: "https://api.sublette.invalid"
      SUBLETTE_REQUEST_TIMEOUT: "15"

targets:
  Sublette:
    type: application
    platform: iOS
    sources:
      - path: Sublette
    info:
      # Generated by xcodegen from the properties below; not checked in.
      path: Sublette/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sublette
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SubletteEnvironment: $(SUBLETTE_ENVIRONMENT)
        SubletteAPIBaseURL: $(SUBLETTE_API_BASE_URL)
        SubletteRequestTimeout: $(SUBLETTE_REQUEST_TIMEOUT)
        # Lets the Debug build reach http://localhost:8000. Hosted servers use https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sublette.Sublette
        # Push notifications (phase 7).
        CODE_SIGN_ENTITLEMENTS: Sublette/Sublette.entitlements
        # iPhone only. Set per target: XcodeGen's iOS preset overrides a project-level value.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  SubletteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SubletteTests
      # Real server responses, also checked by the server's own tests. The Swift
      # models must decode every one of them.
      - path: ../docs/contract/samples
        name: ContractSamples
        buildPhase: resources
    dependencies:
      - target: Sublette
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sublette.SubletteTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sublette:
    build:
      targets:
        Sublette: all
        SubletteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SubletteTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Sublette Staging:
    build:
      targets:
        Sublette: all
    run:
      config: Staging
    archive:
      config: Staging
